<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepositions of Time Quiz | A2+ | Claire's Classroom</title>
<style>
:root{--sage:#a9b9a2;--sage-dark:#6f8069;--terracotta:#d9a58f;--cream:#fffaf3;--ink:#3f403d}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#dfe7da,#f4dddd);padding:42px 20px;text-align:center}
header h1{margin:0 0 8px;font-size:2.25rem}
.container{max-width:900px;margin:30px auto;padding:0 18px}
.intro,.question,.result{background:white;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 4px 16px rgba(80,70,60,.08)}
.question h2{font-size:1.05rem;margin-top:0;color:var(--sage-dark)}
.option{display:block;padding:12px 15px;margin:9px 0;border:1px solid #e5dcd5;border-radius:12px;cursor:pointer;background:#fffdf9}
.option:hover{background:#f4f7f1}
.option input{margin-right:10px}
button{border:0;border-radius:30px;padding:14px 28px;background:var(--sage-dark);color:white;font-size:1rem;font-weight:bold;cursor:pointer}
#result{display:none;text-align:center}
.score{font-size:2rem;color:var(--sage-dark);font-weight:bold}
.feedback{margin-top:10px;padding:10px 14px;border-radius:10px;background:#f8f3ef;text-align:left}
.correct{border-left:4px solid var(--sage-dark)}
.incorrect{border-left:4px solid var(--terracotta)}
.back{text-align:center;margin:24px 0}
.back a{color:var(--sage-dark);font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<header><h1>Prepositions of Time</h1><p>A2+ Interactive Quiz</p></header>
<main class="container">
<div class="intro">
<p><strong>Choose the correct preposition: IN, ON or AT.</strong></p>
<p>Read the whole sentence before you choose.</p>
</div>
<form id="quizForm"></form>
<div style="text-align:center;margin:25px 0"><button type="button" onclick="checkQuiz()">Check my answers</button></div>
<div id="result" class="result">
<div class="score" id="score"></div>
<p id="message"></p>
<div id="feedback"></div>
<br><button type="button" onclick="location.reload()">Try again</button>
</div>
<div class="back"><a href="prepositions-of-time.html">← Back to the lesson</a></div>
</main>
<script>
const questions=[
{q:"My birthday is ___ November.",o:["in","on","at"],a:0,e:"November is a month, so we use in."},
{q:"We have English ___ Monday morning.",o:["in","on","at"],a:1,e:"A day plus a part of the day takes on: on Monday morning."},
{q:"The film starts ___ 7.30 p.m.",o:["in","on","at"],a:2,e:"We use at with a specific clock time."},
{q:"My parents got married ___ 2015.",o:["in","on","at"],a:0,e:"2015 is a year, so we use in."},
{q:"The exam is ___ November 22nd.",o:["in","on","at"],a:1,e:"November 22nd is a date, so we use on."},
{q:"We usually go skiing ___ winter.",o:["in","on","at"],a:0,e:"Winter is a season, so we use in."},
{q:"We always have a big family meal ___ Christmas.",o:["in","on","at"],a:2,e:"Christmas is a festival, and the lesson uses at Christmas."},
{q:"I usually do my homework ___ the evening.",o:["in","on","at"],a:0,e:"We use in with times of day such as in the morning and in the evening."},
{q:"We often go for a walk ___ the weekend.",o:["in","on","at"],a:2,e:"At the weekend is one of the exceptions in the lesson."},
{q:"Which sentence is correct?",o:["I study on the 1990s.","I study in the 1990s.","I study at the 1990s."],a:1,e:"The 1990s are a longer period of time, so we use in."}
];
const form=document.getElementById("quizForm");
questions.forEach((x,i)=>{
 const s=document.createElement("section");s.className="question";
 s.innerHTML=`<h2>${i+1}. ${x.q}</h2>`+x.o.map((v,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${v}</label>`).join("");
 form.appendChild(s);
});
function checkQuiz(){
 let score=0,fb="",un=0;
 questions.forEach((x,i)=>{
  const sel=document.querySelector(`input[name="q${i}"]:checked`);
  if(!sel){un++;fb+=`<div class="feedback incorrect"><strong>${i+1}.</strong> No answer. ${x.e}</div>`;return;}
  if(Number(sel.value)===x.a){score++;fb+=`<div class="feedback correct"><strong>${i+1}.</strong> ✓ ${x.e}</div>`}
  else{fb+=`<div class="feedback incorrect"><strong>${i+1}.</strong> ✗ The correct answer is <strong>${x.o[x.a]}</strong>. ${x.e}</div>`}
 });
 const pct=Math.round(score/10*100);
 let msg=pct>=90?"Excellent!":pct>=70?"Good job!":pct>=50?"Good start — review the lesson and try again.":"Go back to the lesson and review IN, ON and AT before trying again.";
 if(un)msg+=` ${un} question${un>1?"s":""} unanswered.`;
 document.getElementById("score").textContent=`${score} / 10 — ${pct}%`;
 document.getElementById("message").textContent=msg;
 document.getElementById("feedback").innerHTML=fb;
 document.getElementById("result").style.display="block";
 window.scrollTo({top:document.getElementById("result").offsetTop-20,behavior:"smooth"});
}
</script>
</body>
</html>

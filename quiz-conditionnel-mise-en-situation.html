<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Je conseille pour mieux consommer | Mieux consommer</title><style>
:root{--cream:#fbf7f2;--sage-dark:#71816d;--pink-dark:#a97980;--terra:#9b6957;--beige:#ede1d2;--ink:#464945;--white:#fffdf9;--muted:#777b76;--line:#e8e0d9;--good:#e3eee5;--good-ink:#4f7057;--bad:#f5e1e2;--bad-ink:#8b5b62}*{box-sizing:border-box}body{margin:0;font-family:'Avenir Next',Avenir,'Trebuchet MS',sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}.wrap{width:min(900px,92%);margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 0 0}.topbar a{color:var(--sage-dark);font-weight:700;text-decoration:none}.brand{color:#8b837a;font-size:.9rem}.hero{text-align:center;padding:36px 18px 24px}.eyebrow{display:inline-block;background:var(--beige);color:var(--terra);padding:7px 17px;border-radius:999px;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:16px 0 7px;font:500 clamp(2.1rem,6vw,3.1rem) Georgia,serif}.hero p{margin:0;color:var(--muted)}.panel{background:var(--white);border:1px solid #efe5da;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(76,67,58,.08);margin:20px 0}.progress-info{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:7px}.progress{height:8px;background:#ece5dd;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:var(--sage-dark);width:0;transition:width .2s}.question-label{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--terra);margin-bottom:8px}.question{font:500 1.3rem/1.45 Georgia,serif;margin:0 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 15px;font:inherit;color:var(--ink);cursor:pointer}.choice:hover:not(:disabled){border-color:#b7c6b8}.choice:disabled{cursor:default}.choice.correct{background:var(--good);border-color:#bfd2c2;color:var(--good-ink);font-weight:700}.choice.wrong{background:var(--bad);border-color:#e2c0c4;color:var(--bad-ink)}.feedback{display:none;margin-top:14px;padding:13px 15px;border-radius:13px;font-size:.95rem}.feedback.show{display:block}.feedback.good{background:var(--good);color:var(--good-ink)}.feedback.bad{background:var(--bad);color:var(--bad-ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:11px 17px;border-radius:999px;background:var(--sage-dark);color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}.btn.pink{background:var(--pink-dark)}.btn.light{background:#f3ece3;color:#5a5b55}.hidden{display:none!important}.result{text-align:center;background:linear-gradient(135deg,#eef3ed,#f8e9e8);border-radius:18px;padding:20px}.result h2{font:500 1.55rem Georgia,serif;margin:0 0 5px}.score{font:500 2.2rem Georgia,serif;color:var(--sage-dark);margin:4px}.hint{color:var(--muted);font-size:.9rem}footer{text-align:center;border-top:1px solid var(--line);padding:26px;color:#928b82;font-size:.85rem}#print-report{display:none}@media(max-width:600px){.panel{padding:17px}.actions .btn{width:100%}}@media print{body.print-mode>*:not(#print-report){display:none!important}body.print-mode #print-report{display:block!important;font:12pt Arial,sans-serif;color:#222;padding:24px}#print-report h1{font-size:21pt}#print-report h2{font-size:15pt;margin:18px 0 6px}#print-report .item{page-break-inside:avoid;border-top:1px solid #ccc;padding:9px 0}#print-report p{margin:4px 0}#print-report .correct{color:#356643;font-weight:bold}#print-report .incorrect{color:#973f48}}
</style></head><body><main class="wrap"><div class="topbar"><a href="conditionnel-consommation.html">← Mieux consommer</a><span class="brand">Claire's Classroom · A2+</span></div><header class="hero"><span class="eyebrow">Français · A2+ · Conditionnel présent</span><h1>Je conseille pour mieux consommer</h1><p>Choisir le conditionnel dans des situations concrètes</p></header><section class="panel"><div id="stage"></div></section></main><footer>Claire's Classroom · Français A2+</footer><section id="print-report" aria-hidden="true"></section><script>
const title="Je conseille pour mieux consommer";
const questions=[["Ton téléphone fonctionne encore. Quel conseil peux-tu donner à ton ami ?", ["Tu le remplaceras par un nouveau modèle.", "Tu devrais le faire réparer avant d’en acheter un autre.", "Il faut le remplacer tout de suite."], 1, "« Tu devrais + infinitif » exprime un conseil ; le verbe après « devrais » reste à l’infinitif."], ["Ta sœur hésite à acheter une veste neuve. Tu veux lui laisser le choix.", ["Tu regarderas en seconde main.", "Tu pourrais regarder en seconde main.", "Tu regardes en seconde main."], 1, "« Tu pourrais » propose une possibilité sans obliger ta sœur."], ["Vous cherchez une règle générale pour réduire les déchets.", ["Il faudrait réutiliser les objets.", "On doit réutiliser les objets.", "Tu pourrais réutiliser les objets."], 0, "« Il faudrait + infinitif » formule une nécessité générale de façon moins directe."], ["Complète : « Tu pourrais ______ les vêtements que tu ne portes plus. »", ["donnes", "donner", "donné"], 1, "Après le verbe conjugué au conditionnel, le deuxième verbe reste à l’infinitif : donner."], ["Choisis la phrase correcte avec « nous » et « devoir ».", ["Nous devrait choisir des produits durables.", "Nous devrions choisissons des produits durables.", "Nous devrions choisir des produits durables."], 2, "Avec « nous », « devoir » devient « devrions » ; le verbe qui suit reste à l’infinitif : choisir."], ["Tu veux proposer une solution pour un vêtement abîmé.", ["Tu pourrais le jeter et en acheter un autre.", "Tu pourrais le réparer.", "Tu pourrais le répares."], 1, "La forme « tu pourrais + infinitif » propose une solution et « réparer » reste à l’infinitif."], ["Complète avec « il faudrait » : ______ acheter seulement ce qui est nécessaire.", ["Il faudrait", "Il faudra", "Il faut"], 0, "« Il faudrait » est le conditionnel présent de « falloir » ; il est suivi de l’infinitif « acheter »."], ["Un camarade commande souvent sur un coup de tête. Quelle suggestion peux-tu lui faire ?", ["Tu devrais attendre un jour avant de commander.", "Tu attendras un jour avant de commander.", "Il faut que tu attends un jour."], 0, "« Tu devrais + infinitif » donne un conseil adapté à ton camarade."]];
let index=0,score=0,answers=[];
function render(){const stage=document.getElementById('stage');if(index>=questions.length){finish();return}const item=questions[index];stage.innerHTML=`<div class="progress-info"><span>Question ${index+1} sur ${questions.length}</span><span>${score} bonne${score===1?'':'s'} réponse${score===1?'':'s'}</span></div><div class="progress"><div class="bar" style="width:${Math.round(index/questions.length*100)}%"></div></div><div class="question-label">À toi de choisir</div><h2 class="question">${item[0]}</h2><div class="choices">${item[1].map((x,i)=>`<button class="choice" onclick="answer(${i})">${x}</button>`).join('')}</div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="next" class="btn pink hidden" onclick="next()">Continuer →</button></div>`}
function answer(choice){const item=questions[index],buttons=document.querySelectorAll('.choice'),correct=choice===item[2];buttons.forEach(b=>b.disabled=true);buttons[item[2]].classList.add('correct');if(!correct)buttons[choice].classList.add('wrong');if(correct)score++;answers.push({item,choice,correct});const f=document.getElementById('feedback');f.className='feedback show '+(correct?'good':'bad');f.innerHTML=correct?'✓ Bonne réponse ! '+item[3]:'✗ La bonne réponse est : <strong>'+item[1][item[2]]+'</strong><br>'+item[3];document.getElementById('next').classList.remove('hidden')}
function next(){index++;render()}
function restart(){index=0;score=0;answers=[];render()}
function finish(){document.getElementById('stage').innerHTML=`<div class="result"><h2>Quiz terminé !</h2><div class="score">${score} / ${questions.length}</div><p>${score===questions.length?'Bravo, toutes les réponses sont justes !':(questions.length-score)+' réponse'+(questions.length-score>1?'s':'')+' à revoir. Relis les explications, puis recommence si tu veux.'}</p><div class="actions" style="justify-content:center"><button class="btn" onclick="printPdf()">Télécharger mon corrigé en PDF</button><button class="btn pink" onclick="restart()">Refaire le quiz</button><a class="btn light" href="conditionnel-consommation.html">Choisir un autre quiz</a></div><p class="hint">La fenêtre d’impression s’ouvre : choisis « Enregistrer au format PDF » pour télécharger ton corrigé.</p></div>`}
function printPdf(){const rows=answers.map((r,i)=>`<div class="item"><p><strong>${i+1}. ${r.item[0]}</strong></p><p class="${r.correct?'correct':'incorrect'}">Ta réponse : ${r.item[1][r.choice]}</p><p class="correct">Bonne réponse : ${r.item[1][r.item[2]]}</p><p>${r.item[3]}</p></div>`).join('');const report=document.getElementById('print-report');report.innerHTML=`<h1>Claire's Classroom · A2+</h1><h2>${title}</h2><p>Résultat : ${score} / ${questions.length}</p>${rows}`;document.body.classList.add('print-mode');window.onafterprint=()=>document.body.classList.remove('print-mode');window.print()}
render();
</script></body></html>

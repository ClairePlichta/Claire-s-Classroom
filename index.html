<style>
:root{
 --sage:#b8cbbd;--sage2:#e5eee7;--sage-dark:#718878;
 --pink:#e8caca;--pink2:#f8e9e8;
 --terracotta:#dba08d;--terracotta2:#f3ddd5;
 --cream:#fffaf6;--beige:#f2ebe4;--text:#55534f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{
 background:linear-gradient(135deg,#e4eee6 0%,#f6e7e5 55%,#f2ddd4 100%);
 padding:55px 7% 62px;text-align:center;position:relative;overflow:hidden
}
header:before,header:after{content:"";position:absolute;border-radius:50%;opacity:.45}
header:before{width:220px;height:220px;background:#cfe0d3;left:-70px;top:-90px}
header:after{width:300px;height:300px;background:#edcaca;right:-120px;bottom:-170px}
.logo{position:relative;z-index:1;width:68px;height:68px;line-height:68px;margin:0 auto 15px;border-radius:50%;background:#fff9; color:var(--sage-dark);font:28px Georgia,serif}
h1{position:relative;z-index:1;font:400 clamp(30px,3.6vw,46px) Georgia,serif;margin:0 0 10px;color:#55534f}
header p{position:relative;z-index:1;margin:0;color:#6d6964;font-size:17px}
nav{position:sticky;top:0;z-index:10;background:#fffaf6f5;border-bottom:1px solid #e6ddd6;text-align:center;padding:13px;backdrop-filter:blur(8px)}
nav a{text-decoration:underline;text-underline-offset:3px;color:#625f5a;font-weight:bold;font-size:14px;margin:4px 10px;padding:9px 17px;border-radius:25px}
nav a:hover{background:var(--pink2)}
main{max-width:1120px;margin:auto;padding:48px 7% 75px}
.welcome{text-align:center;max-width:720px;margin:0 auto 52px}
.welcome h2{font:400 31px Georgia,serif;margin:0 0 12px}
.welcome p{font-size:16px;line-height:1.6;color:#77736e}
.language{margin:0 0 72px}
.language-title{display:flex;align-items:center;gap:14px;margin-bottom:25px}
.line{height:1px;background:#ded4cc;flex:1}
.language-title h2{font:400 31px Georgia,serif;margin:0}
.english .language-title h2{color:var(--sage-dark)}
.french .language-title h2{color:#b87561}
.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}
.level{
 display:block;text-decoration:none;color:var(--text);text-align:center;
 min-height:138px;padding:25px 15px;border-radius:19px;
 transition:.18s; border:1px solid transparent;
}
.level:hover{transform:translateY(-4px);box-shadow:0 9px 25px #75685d18}
.english .level:nth-child(odd){background:var(--sage2)}
.english .level:nth-child(even){background:#dce9df}
.french .level:nth-child(odd){background:var(--terracotta2)}
.french .level:nth-child(even){background:var(--pink2)}
.cefr{font:400 29px Georgia,serif;margin-bottom:8px}
.desc{font-size:12px;color:#777}
.note{margin-top:17px;text-align:center;font-size:13px;color:#8b857e}
footer{text-align:center;background:#e5eee7;color:#6f7f73;padding:30px;font-size:13px}
.language-choices{max-width:920px;width:86%;margin:34px auto 22px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.language-card{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e8e0d9;border-radius:22px;text-decoration:none;color:var(--text);transition:transform .18s,box-shadow .18s}
.language-card.english{background:linear-gradient(145deg,#e5eee7,#dce9df)}
.language-card.french{background:linear-gradient(145deg,#f3ddd5,#f8e9e8)}
.language-card:hover{transform:translateY(-5px);box-shadow:0 12px 28px #75685d20}
.language-card:focus-visible{outline:3px solid var(--sage-dark);outline-offset:4px}
.language-card .flag{font-size:62px;line-height:1;margin-bottom:9px}
.language-card .label{font:400 clamp(27px,3vw,34px) Georgia,serif}
.cafe-illustration{display:block;width:min(1100px,92%);height:auto;max-height:560px;object-fit:cover;object-position:center;margin:0 auto 58px;border:1px solid #e8e0d9;border-radius:24px;box-shadow:0 14px 34px #75685d18}
@media(max-width:800px){.level-grid{grid-template-columns:repeat(2,1fr)}h1{font-size:42px}}
@media(max-width:450px){.level-grid{grid-template-columns:1fr}h1{font-size:36px}}
@media(max-width:600px){.language-choices{width:min(100%,420px);grid-template-columns:1fr;margin-top:28px;gap:14px}.language-card{min-height:132px}.cafe-illustration{width:94%;border-radius:18px}}
</style>
</head>
<body>
<header>
 <div class="logo">L</div>
 <h1>Language Corner<br>Le coin des langues</h1>
 <p>English & French resources · Ressources en anglais et en français</p>
</header>
<main class="language-choices" aria-label="Choose a language">
 <a class="language-card english" href="english.html" aria-label="Choose English">
  <span class="flag" aria-hidden="true">🇬🇧</span><span class="label">English</span>
 </a>
 <a class="language-card french" href="francais.html" aria-label="Choisir le français">
  <span class="flag" aria-hidden="true">🇫🇷</span><span class="label">Français</span>
 </a>
</main>
<img class="cafe-illustration" src="language-cafe.png" alt="Des personnes discutent dans un café entre des drapeaux britanniques, du Commonwealth, français et francophones.">
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz 2 – Plans or predictions?</title>
<style>
:root{--sage:#b8cbbd;--sage2:#e5eee7;--sage-dark:#718878;--pink:#e8caca;--pink2:#f8e9e8;--terra:#dba08b;--cream:#fffaf6;--ink:#35443b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}
main{max-width:780px;margin:32px auto;padding:22px}a{color:var(--sage-dark);text-decoration:none;font-weight:bold}h1,h2{font-family:Georgia,serif}h1{font-size:2.2rem;margin:18px 0 5px}.muted{color:#65756b}
.question{background:white;border:1px solid #eee2dc;border-radius:17px;padding:18px;margin:16px 0}.qtitle{font-weight:bold;margin-bottom:12px}
label{display:block;padding:9px 12px;border-radius:10px;margin:7px 0;background:#faf8f5;cursor:pointer}label:hover{background:var(--sage2)}input{margin-right:8px}.feedback{margin-top:10px;font-size:.95rem}.correct{color:#39724d}.wrong{color:#a64f4f}
button{border:0;border-radius:999px;background:var(--sage-dark);color:white;padding:12px 22px;font-weight:bold;font-size:1rem;cursor:pointer;margin:10px 8px 10px 0}button.secondary{background:var(--terra)}#result{font-weight:bold;font-size:1.2rem;margin:14px 0}.actions{position:sticky;bottom:0;background:var(--cream);padding:12px 0}
</style></head><body><main><a href="future-be-going-to.html">← Be going to</a><h1>Quiz 2 – Plans or predictions?</h1><p class="muted">Recognise the two uses shown in your lesson: plans and intentions, and likely future events.</p><div id="quiz"></div><div class="actions"><button onclick="check()">Check my answers</button><button class="secondary" onclick="resetQuiz()">Try again</button><div id="result" aria-live="polite"></div></div></main>
<script>
const questions=[{"q": "You have already decided to learn Spanish next year. Which sentence expresses your plan?", "a": ["I am going to learn Spanish next year.", "I learn Spanish next year.", "I am learn Spanish next year.", "I going to learning Spanish next year."], "c": 0, "e": "Be going to is used to talk about plans and intentions."}, {"q": "Look at those dark clouds! It ___ rain.", "a": ["is going to", "are going to", "am going to", "going to"], "c": 0, "e": "Use be going to for something likely to happen, based on present evidence."}, {"q": "Pedro has a revision timetable. He ___ revise for his test tonight.", "a": ["is going to", "are going to", "am going to", "is going"], "c": 0, "e": "A planned intention takes be going to + infinitive."}, {"q": "The bus is leaving and you are still far away. You say: “Hurry up! We ___ miss the bus!”", "a": ["are going to", "is going to", "am going to", "going to"], "c": 0, "e": "The situation gives present evidence that something is likely to happen."}, {"q": "Which situation best matches a plan or intention?", "a": ["I have bought the ingredients. I'm going to make a cake.", "Look at the sky! It's going to snow.", "Careful! You're going to drop that glass.", "The road is icy. We're going to slip."], "c": 0, "e": "Buying the ingredients shows an intention or plan."}, {"q": "Which sentence is a prediction based on what you can see now?", "a": ["Look at that cyclist! He's going to fall.", "I'm going to visit my cousin on Saturday.", "They're going to move house next month.", "She's going to study medicine one day."], "c": 0, "e": "The cyclist's situation provides present evidence for the prediction."}];
const root=document.getElementById('quiz');
questions.forEach((q,i)=>{const d=document.createElement('section');d.className='question';d.innerHTML=`<div class="qtitle">${i+1}. ${q.q}</div>`+q.a.map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}">${a}</label>`).join('')+`<div class="feedback" id="f${i}"></div>`;root.appendChild(d)});
function check(){let score=0;questions.forEach((q,i)=>{const s=document.querySelector(`input[name="q${i}"]:checked`);const f=document.getElementById('f'+i);if(s&&Number(s.value)===q.c){score++;f.className='feedback correct';f.textContent='✓ '+q.e}else{f.className='feedback wrong';f.textContent=(s?'✗ ':'Not answered. ')+q.e}});document.getElementById('result').textContent=`Your score: ${score} / ${questions.length}`}
function resetQuiz(){document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});document.getElementById('result').textContent='';window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
